[build]
  command = "pip install -r requirements.txt"
  publish = "static"

[functions]
  directory = "netlify/functions"
  included_files = ["app.py", "src/**"]


[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
